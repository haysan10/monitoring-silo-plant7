<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Silo Plant 78">
<meta name="description" content="Sistem Monitoring Stok Clinker Silo 7.1, 8.1, 8.2 Plant 78">

<!-- PWA Links -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Monitoring Clinker Silo · PLANT 78</title>

<!-- GSAP for Cinematic Splash & Smooth Transitions -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<!-- SheetJS for Offline Excel Import -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
/* ========================================================
   DESIGN SYSTEM · PLANT 78 · SILO MONITORING
   Light-first, full responsive, industrial aesthetic
   ======================================================== */

/* ---------- Tokens ---------- */
:root {
  /* Surfaces */
  --bg: #f1f5f9;
  --card: #ffffff;
  --card2: #f8fafc;
  --line: #e2e8f0;
  --line2: #cbd5e1;

  /* Ink */
  --ink: #0f172a;
  --ink2: #1e293b;
  --mut: #64748b;
  --muted2: #94a3b8;

  /* Brand accent (orange-red) */
  --acc: #c2410c;
  --acc-hover: #9a3412;
  --acc-lite: #fff7ed;
  --acc-glow: rgba(194, 65, 12, 0.18);

  /* Silo colors */
  --s0: #0f766e;   /* Silo 7.1 – teal */
  --s1: #b45309;   /* Silo 8.1 – amber */
  --s2: #6d28d9;   /* Silo 8.2 – violet */

  /* Status */
  --ok:   #16a34a;
  --ok-bg: #f0fdf4;
  --warn: #d97706;
  --warn-bg: #fffbeb;
  --bad:  #dc2626;
  --bad-bg: #fef2f2;

  /* Geometry */
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 20px;

  /* Elevation */
  --sh-xs: 0 1px 2px rgba(0,0,0,.04);
  --sh-sm: 0 2px 6px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --sh-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);

  /* Typography */
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  color-scheme: light;
  box-sizing: border-box;
}

/* ---------- Dark ---------- */
:root[data-theme="dark"] {
  --bg: #0a0f18;
  --card: #131c2b;
  --card2: #0f1824;
  --line: #1e2d42;
  --line2: #2a3f5a;
  --ink: #e8edf5;
  --ink2: #c8d4e3;
  --mut: #7a8fa8;
  --muted2: #566879;
  --acc: #fb923c;
  --acc-hover: #f97316;
  --acc-lite: #1a1200;
  --acc-glow: rgba(251,146,60,.22);
  --s0: #2dd4bf;
  --s1: #fbbf24;
  --s2: #a78bfa;
  --ok: #4ade80;
  --ok-bg: #052e16;
  --warn: #fbbf24;
  --warn-bg: #1a1200;
  --bad: #f87171;
  --bad-bg: #2a0a0a;
  --sh-xs: 0 1px 2px rgba(0,0,0,.2);
  --sh-sm: 0 2px 6px rgba(0,0,0,.3);
  --sh-md: 0 4px 16px rgba(0,0,0,.4);
  color-scheme: dark;
}

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
html {
  box-sizing: border-box;
  scroll-padding-top: 60px;
  -webkit-text-size-adjust: 100%;
}
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.55 var(--font);
  -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
  /* safe-area padding via JS-injected meta + header sticky */
}

/* =====================================================
   CINEMATIC SPLASH SCREEN
   ===================================================== */
#splash-screen {
  position: fixed; inset: 0; z-index: 99999;
  background: #060b14;
  color: #fff;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  overflow: hidden;
  user-select: none; cursor: pointer;
}
.splash-bg-glow {
  position: absolute;
  width: 70vmax; height: 70vmax;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(194,65,12,.22) 0%, rgba(15,118,110,.12) 40%, transparent 68%);
  pointer-events: none;
  animation: splashPulse 4s ease-in-out infinite;
}
@keyframes splashPulse {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.06); }
}
.splash-grid-lines {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(to right,  rgba(255,255,255,.028) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.028) 1px, transparent 1px);
  background-size: 36px 36px;
  pointer-events: none;
}
.splash-content {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
  padding: 24px 20px;
  max-width: 480px; width: 100%;
  gap: 0;
}
.splash-logo-wrap {
  margin-bottom: 24px;
}
.splash-logo {
  width: min(210px, 55vw);
  height: auto;
  display: block;
  filter: drop-shadow(0 0 24px rgba(251,146,60,.35));
}
.splash-progress-track {
  width: 200px; height: 3px;
  background: rgba(255,255,255,.12); border-radius: 99px;
  overflow: hidden;
}
.splash-progress-bar {
  width: 0%; height: 100%;
  background: linear-gradient(90deg, #0f766e, #c2410c, #fb923c);
  border-radius: 99px;
  box-shadow: 0 0 8px #fb923c;
}

/* =====================================================
   APP SHELL / HEADER
   ===================================================== */
header {
  position: sticky;
  top: 0;
  z-index: 90;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--sh-xs);
}
.bar {
  max-width: 1200px; margin: auto;
  padding: 0 16px;
  display: flex; gap: 8px;
  align-items: stretch;
  min-height: 56px;
}
.brand {
  display: flex; align-items: center; gap: 12px;
  flex: 1; min-width: 0;
  padding: 8px 0;
}
.brand-logo {
  height: 38px; width: auto;
  object-fit: contain;
  display: block; flex: none;
}
.brand-title {
  font-size: 15px; font-weight: 700;
  color: var(--ink); line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  letter-spacing: -.2px;
}
.badge-plant {
  background: var(--acc); color: #fff;
  font-size: 11px; font-weight: 800;
  letter-spacing: 1.2px;
  padding: 3px 8px; border-radius: 6px;
  white-space: nowrap; flex: none;
}
h2 { font-size: 15px; font-weight: 700; line-height: 1.3; }
h3 { font-size: 14px; font-weight: 600; }

/* Nav strip */
nav {
  display: flex; gap: 2px;
  align-items: center;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  flex: none;
  padding: 8px 0;
}
nav::-webkit-scrollbar { display: none; }
nav button {
  font: inherit; font-size: 13px; font-weight: 500;
  border: 0; background: none;
  color: var(--mut);
  padding: 7px 11px;
  border-radius: var(--r-sm);
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, color .15s;
  display: inline-flex; align-items: center; gap: 5px;
  min-height: 36px;
  flex: none;
}
nav button.on {
  background: var(--acc); color: #fff; font-weight: 600;
}
nav button:hover:not(.on) { background: rgba(100,116,139,.12); }

/* Admin status pill – inline */
#admin-status-wrap {
  display: flex; align-items: center; gap: 6px;
  flex: none;
}
.admin-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600;
  padding: 5px 10px;
  border-radius: 99px;
  background: var(--ok-bg);
  color: var(--ok);
  border: 1px solid rgba(22,163,74,.2);
  white-space: nowrap;
}
.admin-pill .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--ok);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: .6; transform: scale(.8); }
}

/* =====================================================
   MAIN CONTENT AREA
   ===================================================== */
main {
  max-width: 1200px; margin: 0 auto;
  padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
}

/* =====================================================
   CARDS
   ===================================================== */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 16px;
  box-shadow: var(--sh-xs);
}
.card + .card { margin-top: 12px; }
.card-sm { padding: 12px; }

/* Grid layouts */
.grid-3 {
  display: grid; gap: 14px;
  grid-template-columns: repeat(3, 1fr);
}
.grid-auto {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
}
/* Legacy .grid alias */
.grid {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
}
.grid > .card { margin: 0; }

/* Card header row */
.hd {
  display: flex; justify-content: space-between;
  align-items: center; gap: 8px;
  margin-bottom: 12px;
}
.hd b {
  border-left: 3px solid var(--c, var(--acc));
  padding-left: 10px;
  font-size: 15px; font-weight: 700;
  letter-spacing: .2px;
}

/* =====================================================
   TANK ILLUSTRATION (Dasbor)
   ===================================================== */
.tank-wrap {
  display: flex; flex-direction: column;
  align-items: center; gap: 4px;
  flex: none;
}
.tank {
  width: 42px; height: 100px;
  border: 2px solid var(--line2);
  border-radius: 6px 6px 14px 14px;
  position: relative; overflow: hidden;
  background: var(--bg);
}
.tank i {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--c, var(--acc));
  opacity: .88;
  transition: height .6s cubic-bezier(.4,0,.2,1);
  border-radius: 0 0 11px 11px;
}
.tank-label { font-size: 10px; color: var(--mut); font-weight: 600; }

/* Stats beside tank */
.mid {
  display: flex; gap: 16px; align-items: center;
}
.big {
  font-size: 28px; font-weight: 800;
  line-height: 1; letter-spacing: -1px;
  color: var(--ink);
}
.big small {
  font-size: 13px; font-weight: 400;
  color: var(--mut); letter-spacing: 0;
}
.kpi-row {
  display: flex; flex-direction: column; gap: 6px;
  flex: 1;
}
.kpi-item {
  display: flex; justify-content: space-between;
  align-items: baseline; gap: 8px;
}
.kpi-label { font-size: 12px; color: var(--mut); }
.kpi-val   { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Legacy aliases */
.kpi { display: flex; gap: 20px; flex-wrap: wrap; align-items: baseline; }
.kpi b { font-size: 22px; letter-spacing: -.5px; }
.mut { color: var(--mut); font-size: 13px; }

/* =====================================================
   BADGES / TAGS
   ===================================================== */
.tag {
  font-size: 11px; font-weight: 700;
  padding: 3px 9px; border-radius: 99px;
  display: inline-flex; align-items: center; gap: 4px;
  letter-spacing: .3px; white-space: nowrap;
}
.tag.ok   { background: var(--ok-bg);   color: var(--ok);   border: 1px solid rgba(22,163,74,.25); }
.tag.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid rgba(217,119,6,.25); }
.tag.bad  { background: var(--bad-bg);  color: var(--bad);  border: 1px solid rgba(220,38,38,.25); }
.tag.info { background: rgba(99,102,241,.1); color: #6366f1; border: 1px solid rgba(99,102,241,.25); }

/* Repeat badge for Riwayat */
.badge-repeat {
  font-size: 10px; font-weight: 700;
  padding: 2px 6px; border-radius: 4px;
  background: rgba(234,179,8,.15);
  color: #92400e; border: 1px solid rgba(234,179,8,.35);
  display: inline-flex; align-items: center; gap: 3px;
}
[data-theme="dark"] .badge-repeat {
  background: rgba(234,179,8,.12); color: #fde68a;
  border-color: rgba(234,179,8,.25);
}

/* =====================================================
   BUTTONS
   ===================================================== */
.btn {
  font: inherit; font-size: 13px; font-weight: 500;
  border: 1px solid var(--line2);
  background: var(--card); color: var(--ink);
  padding: 8px 14px;
  border-radius: var(--r-sm);
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background .15s, border-color .15s, box-shadow .15s;
  min-height: 36px; white-space: nowrap;
  user-select: none;
}
.btn:hover { border-color: var(--mut); background: var(--card2); }
.btn:active { transform: scale(.98); }
.btn.pri {
  background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 700;
  box-shadow: 0 2px 6px var(--acc-glow);
}
.btn.pri:hover { background: var(--acc-hover); border-color: var(--acc-hover); }
.btn.pri:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
.btn.bad   { color: var(--bad); border-color: rgba(220,38,38,.3); }
.btn.bad:hover { background: var(--bad-bg); border-color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: rgba(100,116,139,.1); }
.btn.sm { padding: 5px 10px; font-size: 12px; min-height: 30px; }
.btn.lg { padding: 10px 20px; font-size: 14px; min-height: 42px; }

/* Row/tool toolbars */
.row, .tool {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
}
.sp { flex: 1 1 0; }

/* =====================================================
   FORM ELEMENTS
   ===================================================== */
label > span, .tool label > span:first-child {
  display: block;
  font-size: 12px; font-weight: 600;
  color: var(--mut);
  margin-bottom: 4px;
  letter-spacing: .2px;
}
input, select, textarea {
  font: inherit; color: var(--ink);
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: var(--r-sm);
  padding: 8px 10px;
  width: 100%; min-width: 0;
  transition: border-color .15s, box-shadow .15s;
  appearance: auto;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--acc);
  box-shadow: 0 0 0 3px var(--acc-glow);
}
input:disabled, select:disabled {
  opacity: .55; background: var(--card2); cursor: not-allowed;
}
/* Tool-bar inline inputs */
.tool label { display: flex; flex-direction: column; gap: 0; }
.tool input, .tool select { width: auto; min-width: 110px; }

/* Point measurement grid */
.pts {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 10px;
}
.pts label {
  display: flex; flex-direction: column; gap: 4px;
  font-size: 12px; color: var(--mut); font-weight: 500;
}
.pts label > span { color: var(--mut); font-size: 11px; }
.pts .off input { opacity: .4; }
.pts input { font-size: 15px; font-weight: 600; padding: 9px 8px; }

/* Calc output row */
.out {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 6px;
  border-top: 1px solid var(--line);
  padding-top: 10px;
  font-size: 13px;
}
.out div { display: flex; justify-content: space-between; }
.out b { font-variant-numeric: tabular-nums; }

/* =====================================================
   TOOLBAR / FILTER STRIP
   ===================================================== */
.filter-bar {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px 14px;
  display: flex; gap: 10px;
  flex-wrap: wrap; align-items: flex-end;
  margin-bottom: 14px;
  box-shadow: var(--sh-xs);
}
.filter-bar label {
  display: flex; flex-direction: column; gap: 4px;
  font-size: 12px; color: var(--mut); font-weight: 600;
}
.filter-bar input, .filter-bar select { width: auto; min-width: 100px; }

/* =====================================================
   SEGMENT CONTROL (radio-group)
   ===================================================== */
.rg {
  display: inline-flex; gap: 2px;
  background: var(--bg); padding: 3px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
}
.rg .btn {
  padding: 5px 11px; font-size: 12px; font-weight: 500;
  border: 0; background: none;
  border-radius: 6px; min-height: 30px;
  color: var(--mut);
}
.rg .btn.on {
  background: var(--acc); color: #fff; font-weight: 700;
  box-shadow: 0 1px 4px var(--acc-glow);
}
.rg .btn:hover:not(.on) { background: rgba(100,116,139,.12); color: var(--ink); }

/* =====================================================
   TABLE
   ===================================================== */
.tw { overflow-x: auto; border-radius: var(--r-sm); }
table {
  border-collapse: collapse; width: 100%;
  font-size: 13px; font-variant-numeric: tabular-nums;
}
th, td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--line);
  text-align: left; white-space: nowrap;
}
th {
  color: var(--mut); font-size: 11px; font-weight: 700;
  letter-spacing: .5px; text-transform: uppercase;
  text-align: center; background: var(--card2);
  position: sticky; top: 0; z-index: 1;
}
tbody tr:hover { background: var(--card2); }
tbody tr:last-child td { border-bottom: 0; }
td.n { text-align: right; }
.act { text-align: right; white-space: nowrap; }
.lnk {
  font: inherit; font-size: 12px; font-weight: 600;
  border: 0; background: none;
  color: var(--acc); cursor: pointer;
  padding: 4px 8px; border-radius: 5px;
  transition: background .15s;
}
.lnk:hover { background: var(--acc-lite); }
.lnk.bad { color: var(--bad); }
.lnk.bad:hover { background: var(--bad-bg); }

/* =====================================================
   CHART
   ===================================================== */
svg { width: 100%; height: auto; display: block; }
svg text { fill: var(--mut); font-size: 11px; font-family: var(--font); }
.lg {
  display: flex; gap: 16px; font-size: 12px;
  margin-top: 10px; flex-wrap: wrap;
}
.lg i {
  display: inline-block; width: 14px; height: 3px;
  background: var(--c); margin-right: 4px;
  vertical-align: middle; border-radius: 2px;
}
.chart-wrap {
  position: relative;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 16px;
  box-shadow: var(--sh-xs);
}

/* =====================================================
   TOAST
   ===================================================== */
#toast {
  position: fixed; left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) translateY(8px);
  background: var(--ink2); color: var(--card);
  padding: 10px 18px; border-radius: 10px;
  font-size: 13px; font-weight: 500;
  opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 200000;
  max-width: min(90vw, 400px);
  box-shadow: var(--sh-md);
  text-align: center;
  white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.err  { background: var(--bad); color: #fff; }
#toast.ok   { background: var(--ok);  color: #fff; }

/* =====================================================
   MODALS
   ===================================================== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  z-index: 100000;
  display: none; align-items: center; justify-content: center;
  padding: 16px;
}
.modal-box {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r-lg);
  width: 100%; max-width: 440px;
  padding: 24px;
  box-shadow: var(--sh-md);
  animation: modalIn .2s ease-out both;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(.96) translateY(12px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; gap: 8px;
}
.modal-header h3 { margin: 0; font-size: 17px; }
.modal-close {
  font: inherit; font-size: 20px; line-height: 1;
  border: 0; background: none; color: var(--mut);
  cursor: pointer; padding: 4px 8px; border-radius: 6px;
  transition: background .15s;
  flex: none;
}
.modal-close:hover { background: var(--card2); color: var(--ink); }

/* =====================================================
   LOCK BANNER
   ===================================================== */
.lock-banner {
  background: var(--bad-bg);
  border: 1px solid rgba(220,38,38,.25);
  border-radius: var(--r-md);
  padding: 14px 16px;
  margin-bottom: 16px;
  display: flex; gap: 14px;
  align-items: flex-start; justify-content: space-between;
  flex-wrap: wrap;
}
.lock-banner-text { flex: 1; }
.lock-banner b { color: var(--bad); display: block; margin-bottom: 4px; }
.lock-banner span { font-size: 12px; color: var(--bad); opacity: .85; }

/* =====================================================
   CLOUD PILL
   ===================================================== */
.cloud-pill {
  font-size: 11px; padding: 4px 10px;
  border-radius: 99px;
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--line); background: var(--bg);
  color: var(--mut); font-weight: 500;
}
.cloud-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--ok);
  flex: none;
}
.cloud-dot.off { background: var(--mut); }

/* =====================================================
   MISC UTILITY
   ===================================================== */
.note {
  font-size: 13px; color: var(--mut); line-height: 1.65;
  padding: 14px 16px;
  background: var(--card2);
  border-radius: var(--r-sm);
  border-left: 3px solid var(--acc);
}
.empty { text-align: center; padding: 48px 20px; }
.empty h2 { margin-bottom: 8px; }
.empty .row { justify-content: center; margin-top: 16px; }
.sep { height: 1px; background: var(--line); margin: 16px 0; }

/* Section headers inside main */
.section-hd {
  display: flex; justify-content: space-between;
  align-items: center; gap: 8px;
  margin-bottom: 14px; flex-wrap: wrap;
}
.section-hd h2 { margin: 0; }

/* Total stok banner */
.total-banner {
  background: linear-gradient(135deg, var(--acc) 0%, #9a3412 100%);
  color: #fff; border-radius: var(--r-md);
  padding: 16px 20px;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 8px;
  box-shadow: 0 4px 14px var(--acc-glow);
  margin-bottom: 16px;
}
.total-banner .label { font-size: 12px; font-weight: 600; opacity: .88; letter-spacing: .5px; }
.total-banner .value { font-size: 32px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
.total-banner .sub   { font-size: 12px; opacity: .75; }

/* =====================================================
   RESPONSIVE
   ===================================================== */
@media (max-width: 768px) {
  .grid-3 { grid-template-columns: 1fr; }
  h1      { font-size: 14px; }
  h1 small { display: none; }
  .bar    { min-height: 50px; }
}
@media (max-width: 600px) {
  main    { padding: 14px 12px 32px; }
  .pts    { grid-template-columns: repeat(2, 1fr); }
  .kpi    { gap: 10px; }
  nav button { padding: 6px 9px; font-size: 12px; }
  .total-banner .value { font-size: 26px; }
  .modal-box { padding: 18px; }
  .bar    { padding: 0 12px; }
}
@media (max-width: 400px) {
  .pts    { grid-template-columns: 1fr 1fr; }
  .btn    { font-size: 12px; padding: 7px 11px; }
}

/* Focus ring (a11y) */
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 2px;
}
</style>

// Shift Timing helper
// Shift A: 07:00 - 15:00
// Shift B: 15:01 - 23:00
// Shift C: 23:01 - 07:00
function getShiftSchedule(now = new Date()) {
  const h = now.getHours();
  const m = now.getMinutes();
  const mins = h * 60 + m;

  if (mins >= 420 && mins <= 900) { // 07:00 s/d 15:00
    return { shift: 'A', date: today() };
  } else if (mins > 900 && mins <= 1380) { // 15:01 s/d 23:00
    return { shift: 'B', date: today() };
  } else { // 23:01 s/d 06:59
    if (mins > 1380) {
      // 23:01 s/d 23:59 represents start of Shift C closing tomorrow morning
      const nextDay = new Date(now.getTime() + 864e5);
      return { shift: 'C', date: nextDay.toISOString().slice(0, 10) };
    } else {
      // 00:00 s/d 06:59 represents Shift C of today
      return { shift: 'C', date: today() };
    }
  }
}

// Check 8-hour editable window for non-admin
function checkShiftWindow(dateStr, shiftStr, now = new Date()) {
  if (adminState.isAdmin) {
    return { isAllowed: true, reason: 'Mode Admin: Bebas ubah data kapan saja' };
  }

  const [y, m, d] = dateStr.split('-').map(Number);
  let startTime, endTime;

  if (shiftStr === 'A') {
    startTime = new Date(y, m - 1, d, 7, 0, 0);
    endTime = new Date(y, m - 1, d, 15, 0, 0);
  } else if (shiftStr === 'B') {
    startTime = new Date(y, m - 1, d, 15, 1, 0);
    endTime = new Date(y, m - 1, d, 23, 0, 0);
  } else if (shiftStr === 'C') {
    // Shift C ended at 07:00 on dateStr, started at 23:01 yesterday
    startTime = new Date(y, m - 1, d - 1, 23, 1, 0);
    endTime = new Date(y, m - 1, d, 7, 0, 0);
  }

  const nowMs = now.getTime();
  // 30-minute grace period after shift handover
  const graceMs = 30 * 60 * 1000;
  const isAllowed = (nowMs >= startTime.getTime()) && (nowMs <= (endTime.getTime() + graceMs));

  return {
    isAllowed,
    startTime,
    endTime,
    reason: isAllowed 
      ? 'Dalam durasi 8 jam shift berjalan' 
      : 'Shift telah berakhir (> 8 jam). Hanya Admin yang dapat merevisi data.'
  };
}

// Get calibration profile for a specific date and shift
function getProfileFor(d, s) {
  const key = d + '_' + s;
  if (S.prof.overrides && S.prof.overrides[key]) {
    return S.prof.overrides[key];
  }
  return S.prof.default || DEF;
}

const srt = () => S.recs.slice().sort((a, b) => (a.d + OR[a.s]) < (b.d + OR[b.s]) ? -1 : 1);
const lk = k => {
  const i = Math.round(k / 0.25);
  return i < 0 ? TBL[0] : (i >= TBL.length ? 0 : TBL[i]);
};

function calc(x, p) {
  const mr = x.reduce((a, v, i) => a + (+v || 0) * p.w[i], 0) / p.n;
  const ma = mr > p.th ? mr * p.hi : mr * p.lo;
  const k = Math.round(ma / 0.25) * 0.25;
  return { mr, ma, k, t: lk(k) };
}

function toast(m, e) {
  const t = $('#toast');
  t.textContent = m;
  t.className = 'show' + (e ? ' err' : '');

}

function getDailyAgg(R) {
  const map = new Map();
  R.forEach(r => {
    let entry = map.get(r.d);
    if (!entry) {
      entry = { d: r.d, shifts: [], v: {} };
      map.set(r.d, entry);
    }
    entry.shifts.push(r);
    entry.v = r.v;
  });
  return Array.from(map.values()).sort((a, b) => a.d < b.d ? -1 : 1);
}

function getWeeklyAgg(days) {
  const weeks = [];
  for (let i = 0; i < days.length; i += 7) {
    const chunk = days.slice(i, i + 7);
    const last = chunk[chunk.length - 1];
    weeks.push({
      start: chunk[0].d,
      end: last.d,
      d: last.d,
      v: last.v,
      daysCount: chunk.length
    });
  }
  return weeks;
}

// SVG Chart Engine
function chart(R) {
  if (R.length < 2) return '<p class="mut">Data belum cukup untuk grafik tren.</p>';
  let dataPoints = R;
  if (cGran === 'daily') dataPoints = getDailyAgg(R);
  const lastD = dataPoints[dataPoints.length - 1].d;
  const cut = rng ? new Date(Date.parse(lastD) - rng * 864e5).toISOString().slice(0, 10) : '';
  const D = cut ? dataPoints.filter(r => r.d >= cut) : dataPoints;
  if (D.length < 2) return '<p class="mut">Data belum cukup pada rentang waktu ini.</p>';

  const W = 800, H = 260, l = 54, r = 14, t = 14, b = 28;
  let mx = 0;
  D.forEach(x => SI.forEach(id => {
    if (x.v[id] && x.v[id].t != null) mx = Math.max(mx, x.v[id].t);
  }));
  mx = Math.ceil(mx / 10000) * 10000 || 50000;

  const X = i => l + i * (W - l - r) / (D.length - 1);
  const Y = v => t + (H - t - b) * (1 - v / mx);
  let g = '';

  for (let i = 0; i <= 4; i++) {
    const y = Y(mx * i / 4);
    g += `<line x1="${l}" x2="${W - r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 3"/>`;
    g += `<text x="${l - 6}" y="${y + 4}" text-anchor="end">${f0(mx * i / 4)}</text>`;
  }

  SI.forEach((id, j) => {
    const pts = D.map((x, i) => (x.v[id] && x.v[id].t != null) ? `${X(i).toFixed(1)},${Y(x.v[id].t).toFixed(1)}` : '').filter(Boolean).join(' ');
    if (pts) {
      g += `<polyline points="${pts}" fill="none" stroke="var(--s${j})" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
  });

  g += `<text x="${l}" y="${H - 8}">${fd(D[0].d)}</text>`;
  g += `<text x="${W - r}" y="${H - 8}" text-anchor="end">${fd(lastD)}</text>`;

  return `
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik tren stok clinker Silo 7.1, 8.1, 8.2">
      ${g}
    </svg>
    <div class="lg">
      ${SI.map((id, j) => `<span style="--c:var(--s${j})"><i></i>Silo ${id}</span>`).join('')}
    </div>
  `;
}

function saveIn() {
  const win = checkShiftWindow(IN.d, IN.s);
  if (!win.isAllowed) {
    return toast('Shift terkunci (> 8 jam). Hubungi Admin untuk koreksi data.', 1);
  }

  // Validate NIK
  const nikVal = String(IN.nik || '').trim();
  if (!/^\d{7}$/.test(nikVal)) {
    return toast('NIK harus terdiri dari 7 digit angka pekerja!', 1);
  }
  localStorage.setItem('silo.operator_nik', nikVal);

  const prof = getProfileFor(IN.d, IN.s);
  const v = {};
  for (const id of SI) {
    const p = prof[id];
    const x = [0, 1, 2, 3, 4, 5].map(k => (IN.x[id] || [])[k]);
    if (x.every(n => n == null)) continue;
    const miss = RM.filter((r, k) => p.w[k] && (x[k] == null || isNaN(x[k])));
    if (miss.length) return toast(`Silo ${id}: lengkapi titik ${miss.join(', ')}`, 1);
    if (x.some(n => n != null && (n < 0 || n > HT))) return toast(`Silo ${id}: nilai harus antara 0 s.d. ${String(HT).replace('.', ',')} m`, 1);
    const c = calc(x, p);
    v[id] = { x, mr: c.mr, ma: c.ma, k: c.k, t: c.t };
  }
  if (!Object.keys(v).length) return toast('Isi minimal satu silo', 1);

  const payload = {
    tanggal: IN.d,
    shift: IN.s,
    nik: nikVal,
    isAdmin: adminState.isAdmin,
    silo71: v['7.1'] ? v['7.1'].x : [null,null,null,null,null,null],
    silo81: v['8.1'] ? v['8.1'].x : [null,null,null,null,null,null],
    silo82: v['8.2'] ? v['8.2'].x : [null,null,null,null,null,null]
  };

  // Instant local persistence
  S.recs = S.recs.filter(r => !(r.d === IN.d && r.s === IN.s));
  S.recs.push({ d: IN.d, s: IN.s, nik: nikVal, v });
  save();

  // Cloud sync
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(() => toast('Tersimpan di Google Sheets & Lokal'))
      .withFailureHandler(() => toast('Tersimpan lokal (Google Sheets offline)', 1))
      .simpanCatatan(payload);
  } else if (GAS_API_URL) {
    fetch(GAS_API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(() => {
      isCloudOnline = true;
      toast('Catatan tersimpan ke Cloud & Offline');
    }).catch(() => {
      toast('Tersimpan offline (Cloud pending)', 1);
    });
  } else {
    toast('Catatan shift berhasil disimpan');
  }

  render();
}

function expCSV() {
  const headers = [
    'Tanggal', 'Shift', 'NIK_Operator',
    '7.1_I', '7.1_II', '7.1_III', '7.1_IV', '7.1_V', '7.1_VI', '7.1_Real', '7.1_Adjust', '7.1_Bulat', '7.1_Stok',
    '8.1_I', '8.1_II', '8.1_III', '8.1_IV', '8.1_V', '8.1_VI', '8.1_Real', '8.1_Adjust', '8.1_Bulat', '8.1_Stok',
    '8.2_I', '8.2_II', '8.2_III', '8.2_IV', '8.2_V', '8.2_VI', '8.2_Real', '8.2_Adjust', '8.2_Bulat', '8.2_Stok'
  ];
  const lines = [headers.join(',')];
  srt().forEach(r => {
    const row = [r.d, r.s, r.nik || ''];
    SI.forEach(id => {
      const c = r.v[id];
      for (let k = 0; k < 6; k++) {
        row.push(c && c.x && c.x[k] != null ? c.x[k] : '');
      }
      row.push(c && c.mr != null ? c.mr : '');
      row.push(c && c.ma != null ? c.ma : '');
      row.push(c && c.k != null ? c.k : '');
      row.push(c && c.t != null ? c.t : '');
    });
    lines.push(row.join(','));
  });

  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Rekap_Silo_Plant78_${today()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('File CSV berhasil diunduh');
}

function imp(f) {
  if (!adminState.isAdmin) return toast('Hanya Admin yang dapat mengimpor Excel', 1);
  if (!f) return;
  if (typeof XLSX === 'undefined') return toast('Pustaka Excel belum termuat', 1);
  const fr = new FileReader();
  fr.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const ws = wb.Sheets['Rekap Silo 2026'] || wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
      const B = [0, 13, 25], out = [];
      let ld = null;
      for (let i = 3; i < rows.length; i++) {
        const r = rows[i] || [];
        if (typeof r[0] === 'number') ld = new Date(Math.round((r[0] - 25569) * 864e5)).toISOString().slice(0, 10);
        else if (typeof r[0] === 'string' && r[0].includes('-')) ld = r[0].slice(0, 10);
        if (!ld || !SH.includes(r[1])) continue;
        const v = {};
        let any = 0;
        B.forEach((b, j) => {
          const x = r.slice(b + 2, b + 8).map(n => typeof n === 'number' ? n : null);
          if (x.some(n => n != null)) {
            any = 1;
            v[SI[j]] = {
              x,
              mr: +(+r[b + 8] || 0).toFixed(2),
              ma: +(+r[b + 9] || 0).toFixed(2),
              k: +r[b + 10] || 0,
              t: +(+r[b + 11] || 0).toFixed(1)
            };
          }
        });
        if (any) out.push({ d: ld, s: r[1], nik: r[37] ? String(r[37]) : '-', v });
      }
      if (!out.length) return toast('Tidak ada baris data terbaca.', 1);
      const m = new Map(S.recs.map(r => [r.d + r.s, r]));
      out.forEach(r => m.set(r.d + r.s, r));
      S.recs = Array.from(m.values());
      srt();
      save();
      loadIN();
      toast(`${f0(out.length)} catatan berhasil diimpor`);
      render();
    } catch (x) {
      toast('Gagal memproses file Excel: ' + x.message, 1);
    }
  };
  fr.readAsArrayBuffer(f);
}

        <button class="btn ${calMode === 'global' ? 'on' : ''}" onclick="calMode='global';render()">

          🎯 Kalibrasi Khusus (Tanggal & Shift Tertentu)

    ${calMode === 'specific' ? `
      <div class="card tool" style="border-color:var(--s1); background:rgba(180,83,9,0.04);">
        <label>
          Pilih Tanggal Khusus
          <input type="date" id="cal-date" value="${calSpecDate}">

        <label>
          Pilih Shift Khusus
          <select id="cal-shift">
            ${SH.map(s => `<option ${s === calSpecShift ? 'selected' : ''}>Shift ${s}</option>`).join('')}
          </select>
        </label>
        <span class="tag ${isOverrideActive ? 'warn' : 'ok'}">
          ${isOverrideActive ? '🎯 Kalibrasi khusus aktif untuk shift ini' : '🌐 Mengikuti kalibrasi global (belum ada override)'}
        </span>
      </div>
    ` : ''}

        <button class="btn pri" onclick="saveCalGlobal()">💾 Simpan Kalibrasi Global</button>

        ` : ''}
      `}

    ${overridesList.length > 0 ? `
      <div class="card" style="margin-top:14px;">
        <h3>Daftar Kalibrasi Khusus yang Aktif (${overridesList.length})</h3>

              </tr>
            </thead>
            <tbody>
              ${overridesRows}
            </tbody>
          </table>
        </div>
      </div>
    ` : ''}


  `;
}

function saveCalGlobal() {
  if (!adminState.isAdmin) return toast('Akses Admin diperlukan', 1);
  const P = clone(S.prof.default || DEF);
  let ok = 1;
  document.querySelectorAll('[data-c]').forEach(e => {
    const v = parseFloat(e.value);
    const p = P[e.dataset.c];
    const f = e.dataset.f;
    if (!isFinite(v) || (f === 'n' && v < 1) || v < 0) ok = 0;
    else if (f[0] === 'w') p.w[+f.slice(1)] = v;
    else p[f] = v;
  });
  if (!ok) return toast('Periksa isian angka kalibrasi', 1);
  S.prof.default = P;
  save();

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run.simpanKalibrasi(P, adminState.pin);
  }
  toast('Kalibrasi global berhasil disimpan');
}

function resetCalGlobal() {
  if (!adminState.isAdmin) return toast('Akses Admin diperlukan', 1);
  S.prof.default = clone(DEF);
  save();
  toast('Kalibrasi global di-reset ke standar Plant 78');
  render();
}

function saveCalSpecific() {
  if (!adminState.isAdmin) return toast('Akses Admin diperlukan', 1);
  const P = clone(DEF);
  let ok = 1;
  document.querySelectorAll('[data-c]').forEach(e => {
    const v = parseFloat(e.value);
    const p = P[e.dataset.c];
    const f = e.dataset.f;
    if (!isFinite(v) || (f === 'n' && v < 1) || v < 0) ok = 0;
    else if (f[0] === 'w') p.w[+f.slice(1)] = v;
    else p[f] = v;
  });
  if (!ok) return toast('Periksa isian angka kalibrasi', 1);
  const key = calSpecDate + '_' + calSpecShift;
  S.prof.overrides = S.prof.overrides || {};
  S.prof.overrides[key] = P;
  save();
  toast(`Kalibrasi khusus untuk ${fd(calSpecDate)} Shift ${calSpecShift} tersimpan`);
  render();
}

function deleteOverrideKey(d, s) {
  if (!adminState.isAdmin) return toast('Akses Admin diperlukan', 1);
  const key = d + '_' + s;
  if (S.prof.overrides && S.prof.overrides[key]) {
    delete S.prof.overrides[key];
    save();
    toast(`Override ${fd(d)} Shift ${s} dihapus`);
    render();
  }
}

function editOverrideKey(d, s) {
  calMode = 'specific';
  calSpecDate = d;
  calSpecShift = s;
  render();
}

  if (t.id === 'fn') {
    IN.nik = t.value;
  } else if (t.dataset.s) {
    const a = IN.x[t.dataset.s] = IN.x[t.dataset.s] || [null, null, null, null, null, null];
    a[+t.dataset.k] = t.value === '' ? null : +t.value;
    upd(t.dataset.s);
  }
});

$('#app').addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fd') {
    if (t.value) IN.d = t.value;
    loadIN();
    render();
  } else if (t.id === 'fs') {
    // Extract single letter A, B, or C from select text
    const sMatch = t.value.match(/Shift\s+([ABC])/);
    if (sMatch) IN.s = sMatch[1];
    else IN.s = t.value.charAt(0);
    loadIN();
    render();
  } else if (t.id === 'cal-date') {
    calSpecDate = t.value;
    render();
  } else if (t.id === 'cal-shift') {
    const sMatch = t.value.match(/Shift\s+([ABC])/);
    if (sMatch) calSpecShift = sMatch[1];
    else calSpecShift = t.value.charAt(0);
    render();
  } else if (t.id === 'ha' || t.id === 'hb' || t.id === 'hq') {
    if (t.id === 'ha') HF.a = t.value;
    if (t.id === 'hb') HF.b = t.value;
    if (t.id === 'hq') HF.q = t.value;
    lim = 50;
    render();
  }
});

$('#app').addEventListener('click', e => {
  const b = e.target.closest('[data-e],[data-x]');
  if (!b) return;
  if (b.dataset.e) {
    const parts = b.dataset.e.split('|');
    IN.d = parts[0];
    IN.s = parts[1];
    go('input');
  } else if (b.dataset.x) {
    if (!adminState.isAdmin) return toast('Hanya Admin yang dapat menghapus data', 1);
    twice(b, () => {
      const parts = b.dataset.x.split('|');
      S.recs = S.recs.filter(r => !(r.d === parts[0] && r.s === parts[1]));
      save();
      toast('Catatan ' + fd(parts[0]) + ' Shift ' + parts[1] + ' dihapus');
      render();
    });
  }
});

// PWA Service Worker Registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW err:', err));
  });
}

// Initial Boot
load();
loadIN();
render();
runSplashAnimation();
</script>
</body>
</html>
